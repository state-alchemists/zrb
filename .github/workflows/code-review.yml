name: "Code Review"
run-name: "Review PR #${{ github.event.pull_request.number }} by ${{ github.actor }}"

on:
  pull_request:
    branches:
      - main

jobs:
  review:
    # Two separate guards. author_association stops a drive-by PR from
    # spending tokens on an LLM run. The head-repo check is about mechanics:
    # GitHub withholds secrets from fork PRs, so the review would 401 there
    # regardless of who opened it -- skipping beats a red X nobody can fix.
    if: >-
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR') &&
      github.event.pull_request.head.repo.full_name == github.repository
    # pull-requests: write is what lets the reusable workflow post the report.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_zrb.yml
    with:
      environment: DEV
      # The reviewer diffs against the merge base, so it needs full history --
      # the default depth of 2 has no origin/<base> to compare against.
      fetch-depth: 0
      # Written by the review task, posted by _zrb.yml once the command exits.
      comment-file: code-review.md
      # $GITHUB_BASE_REF is read at runtime instead of interpolated with
      # ${{ }}: a branch name comes from the PR author, and interpolation
      # would splice it into the shell command rather than pass it as a value.
      command: |
        zrb code review --range "origin/$GITHUB_BASE_REF...HEAD" --output code-review.md
    secrets:
      ZRB_LLM_API_KEY: ${{ secrets.ZRB_LLM_API_KEY }}
      ZRB_LLM_MODEL: ${{ secrets.ZRB_LLM_MODEL }}
      ZRB_LLM_BASE_URL: ${{ secrets.ZRB_LLM_BASE_URL }}
