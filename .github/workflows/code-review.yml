name: "Code Review"
run-name: "Review PR #${{ github.event.pull_request.number }} by ${{ github.actor }}"

on:
  pull_request:
    branches:
      - main

jobs:
  review:
    # Two separate guards. author_association stops a drive-by PR from
    # spending tokens on an LLM run. The head-repo check is about mechanics:
    # GitHub withholds secrets from fork PRs, so the review would 401 there
    # regardless of who opened it -- skipping beats a red X nobody can fix.
    if: >-
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR') &&
      github.event.pull_request.head.repo.full_name == github.repository
    # pull-requests: write is what lets the reusable workflow post the report.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_zrb.yml
    with:
      fetch-depth: 0
      command: |
        if [ -z "$OPENAI_API_KEY" ]; then
          echo "⏭️  OPENAI_API_KEY is not configured; skipping the LLM review."
          exit 0
        fi
        zrb submit-comment --range "origin/$GITHUB_BASE_REF...HEAD"
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ZRB_LLM_MODEL: ${{ secrets.ZRB_LLM_MODEL }}
