name: Run Command

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      needs-github-token:
        # Off by default: the token reaches `inputs.command`, and most commands
        # have no business holding it. Only a caller that posts back to the PR
        # asks for it.
        required: false
        type: boolean
        default: false
      fetch-depth:
        required: false
        type: number
        default: 2
    secrets:
      OPENAI_API_KEY:
        required: false
      ZRB_LLM_MODEL:
        required: false

jobs:

  # Docs: https://docs.github.com/en/actions/using-workflows/reusing-workflows
  Run-command:
    runs-on: ubuntu-latest
    container:
      image: stalchmst/zrb:3.5.0
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ZRB_LLM_MODEL: ${{ secrets.ZRB_LLM_MODEL || vars.ZRB_LLM_MODEL }}
      ZRB_LLM_JOURNAL_ENABLED: "false"
      ZRB_INIT_STRICT: "1"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Show Info
        run: |
          echo "🙋 PIC: ${{ github.actor }}"
          echo "🎉 Event: ${{ github.event_name }}"
          echo "🐧 OS: ${{ runner.os }}"
          echo "🔎 Branch: ${{ github.ref }}"
          echo "🔎 Repo: ${{ github.repository }}"

      - name: Run command
        shell: bash
        env:
          # The command is passed as *data*, not spliced into the script by
          # `${{ }}`. Interpolating it inline makes this step a script-injection
          # sink the moment any caller builds `command` out of event data (a PR
          # title, a branch name) -- and that injected code would run with
          # whatever this step's env holds.
          ZRB_COMMAND: ${{ inputs.command }}
          # Empty unless the caller opted in. The true branch is non-empty, so
          # this avoids the `&& '' ||` falsy trap documented in test.yml.
          GITHUB_TOKEN: ${{ inputs.needs-github-token && github.token || '' }}
        run: |
          set -e
          echo "🏁 Start running"
          eval "$ZRB_COMMAND"

      - run: echo "🍏 This job's status is ${{ job.status }}."
