name: Run Command

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      needs-github-token:
        # Off by default: the token reaches `inputs.command`, and most commands
        # have no business holding it.
        required: false
        type: boolean
        default: false
      fetch-depth:
        required: false
        type: number
        default: 2
    secrets:
      OPENAI_API_KEY:
        required: false
      ZRB_LLM_MODEL:
        required: false
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:

  # Docs: https://docs.github.com/en/actions/using-workflows/reusing-workflows
  Run-command:
    runs-on: ubuntu-26.04
    container:
      # Pinned by digest as well as tag: this image supplies the `zrb` that runs
      # with the secrets below.
      image: stalchmst/zrb:3.28.1@sha256:60f2934bf71d4cf28d8e479c3d7f3a5d10a0b7f14cd297183598209a0c3ce2f3
      # Anonymous pulls from shared runner IPs hit Docker Hub's rate limit.
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ZRB_LLM_MODEL: ${{ secrets.ZRB_LLM_MODEL || vars.ZRB_LLM_MODEL }}
      ZRB_LLM_JOURNAL_ENABLED: "false"
      ZRB_INIT_STRICT: "1"
    steps:
      - name: Check out repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          # The base branch under `pull_request_target`; never the head, whose
          # `zrb_init.py` would then load where `zrb` looks for it.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref || github.ref }}

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Show Info
        run: |
          echo "🙋 PIC: ${{ github.actor }}"
          echo "🎉 Event: ${{ github.event_name }}"
          echo "🐧 OS: ${{ runner.os }}"
          echo "🔎 Branch: ${{ github.ref }}"
          echo "🔎 Repo: ${{ github.repository }}"

      - name: Run command
        shell: bash
        env:
          # The command is passed as data, not spliced in by `${{ }}`: inline
          # interpolation would make this a script-injection sink.
          ZRB_COMMAND: ${{ inputs.command }}
          GITHUB_TOKEN: ${{ inputs.needs-github-token && github.token || '' }}
        run: |
          set -e
          echo "🏁 Start running"
          eval "$ZRB_COMMAND"

      - run: echo "🍏 This job's status is ${{ job.status }}."
