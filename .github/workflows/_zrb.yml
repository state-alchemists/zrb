name: Run Command

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      comment-file:
        required: false
        type: string
        default: ""
      fetch-depth:
        required: false
        type: number
        default: 2
    secrets:
      OPENAI_API_KEY:
        required: false
      ZRB_LLM_MODEL:
        required: false

jobs:

  # Docs: https://docs.github.com/en/actions/using-workflows/reusing-workflows
  Run-command:
    runs-on: ubuntu-latest
    container:
      image: stalchmst/zrb:3.0.0b11
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ZRB_LLM_MODEL: ${{ secrets.ZRB_LLM_MODEL || vars.ZRB_LLM_MODEL }}
      ZRB_LLM_JOURNAL_ENABLED: "false"
      ZRB_INIT_STRICT: "1"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Show Info
        run: |
          echo "🙋 PIC: ${{ github.actor }}"
          echo "🎉 Event: ${{ github.event_name }}"
          echo "🐧 OS: ${{ runner.os }}"
          echo "🔎 Branch: ${{ github.ref }}"
          echo "🔎 Repo: ${{ github.repository }}"

      - name: Run command
        shell: bash
        run: |
          set -e
          echo "🏁 Start running"
          ${{ inputs.command }}

      - name: Post report as a pull-request comment
        if: always() && inputs.comment-file != '' && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMENT_FILE: ${{ inputs.comment-file }}
        shell: bash
        run: zrb submit-comment --file "$COMMENT_FILE"

      - run: echo "🍏 This job's status is ${{ job.status }}."
