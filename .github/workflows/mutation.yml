name: "Mutation ratchet"
run-name: "Mutation kill rate"

on:
  schedule:
    # Nightly rather than per-commit: a pass is minutes, and the per-commit gate
    # stays `zrb-test.sh`.
    - cron: "0 3 * * *"
  # The job that proves a floor can be raised is the one run on the branch that
  # earned it, so manual dispatch matters as much as the schedule.
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to score (space-separated, relative to src/zrb). Empty = all."
        required: false
        type: string
      mutants:
        description: "Mutants sampled per package."
        required: false
        default: "25"
        type: string

jobs:
  mutation:
    runs-on: ubuntu-latest
    # ~10 minutes locally for the default sample; the rest is slack for a slower
    # runner, not a budget.
    timeout-minutes: 60

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install ripgrep
        # file_search and the journal tool prefer `rg`; one test drives that path
        # directly and needs the binary present.
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Build README.pypi.md
        # Gitignored, and Poetry reads it from pyproject, so it must exist before
        # `poetry install`.
        run: python scripts/build_pypi_readme.py

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-Linux-3.13-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --all-extras --no-interaction

      - name: Score mutation kill rate
        # Inputs reach the shell as *data*, never spliced in by `${{ }}` -- the
        # rule `_zrb.yml` documents. `PACKAGES` is unquoted on use so an empty
        # value expands to no argument (every package in FLOORS) rather than one
        # empty argument.
        env:
          PACKAGES: ${{ inputs.packages }}
          MUTANTS: ${{ inputs.mutants || '25' }}
        run: >-
          poetry run python scripts/mutation_ratchet.py
          --mutants "$MUTANTS"
          --json mutation-results.json
          $PACKAGES

      - name: Upload results
        # The results matter most on the run that failed, which a default
        # `if: success()` would skip.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: mutation-results.json
          if-no-files-found: ignore
