name: "Test"
run-name: "Run tests for ${{ github.actor }}"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Pinned images, never `-latest`; the guard test enforces it, and the cache
      # key below names the image so a virtualenv only returns to the OS that built it.
      matrix:
        include:
          # pyproject: >=3.11,<3.15.
          - os: ubuntu-26.04
            python-version: "3.11"
            test-args: ""
          - os: ubuntu-26.04
            python-version: "3.12"
            test-args: ""
          - os: ubuntu-26.04
            python-version: "3.13"
            test-args: ""
          - os: ubuntu-26.04
            python-version: "3.14"
            test-args: ""
          # Windows and macOS are documented as supported and src/ carries platform
          # branches, so one interpreter each checks the suite still runs there.
          # `test-args` is per row because GitHub expressions have no inline
          # conditional, and `&& '' ||` is falsy-trap bait.
          - os: windows-2025-vs2026
            python-version: "3.13"
            test-args: "test"
          - os: macos-26
            python-version: "3.13"
            test-args: "test"

    steps:
      - name: Check out repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Build README.pypi.md
        # README.pypi.md is the readme Poetry packages (it is gitignored), so it
        # must be generated before `poetry install` reads pyproject.
        run: python scripts/build_pypi_readme.py

      - name: Cache Poetry virtualenv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Poetry's cache dir differs per platform, and all three sit outside the
          # checkout.
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\pypoetry\Cache' || (runner.os == 'macOS' && '~/Library/Caches/pypoetry' || '~/.cache/pypoetry') }}
          # The interpreter a venv points at, and the image it was built on.
          key: poetry-${{ matrix.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --all-extras --no-interaction

      - name: Lint and run tests with coverage
        # The same script developers run locally. Ubuntu passes no target and gets
        # pyright plus the coverage floor; windows/macOS pass `test` and skip both.
        shell: bash
        run: poetry run bash zrb-test.sh ${{ matrix.test-args }}
