[project]
name = "zrb"
version = "3.28.1"
description = "A terminal coding agent with a build system inside"
authors = [{name = "Go Frendi Gunawan", email = "gofrendiasgard@gmail.com"}]
license = "AGPL-3.0-or-later"
readme = "README.pypi.md"
keywords = [
    "AI Agent", "Coding Agent", "LLM", "MCP", "Agentic",
    "Automation", "Task Runner", "DAG", "Pipeline", "Code Generator",
]
requires-python = ">=3.11.0,<3.15.0"
dependencies = [
    "python-dotenv>=1.1.1,<2.0.0",
    "beautifulsoup4>=4.14.2,<5.0.0",
    "pdfplumber>=0.11.7,<0.12.0",
    "fastapi>=0.141.1,<0.142.0",
    "uvicorn>=0.52.4,<0.53.0",
    "jinja2>=3.1.0,<4.0.0",
    # PyJWT and pyjwt normalize to the same distribution; consolidated to the
    # stricter pin so PEP-621 does not see a duplicate dependency.
    # Security fix: GHSA-xgmm-8j9v-c9wx (CVE-2026-48526) - JWT forgery via JWK-as-HMAC-secret confusion.
    # Security fixes: GHSA-ffc3-869f-jxw9 (critical, asymmetric-PEM detection bypass), plus the
    # high/medium HS-vs-asymmetric confusion and PyJWKClient issues (GHSA-9j54-fg26-wv3r,
    # GHSA-9v7f-9g4p-ffgj, GHSA-r6x4-923q-g947, GHSA-w2cx-738m-mc7w, GHSA-p4g4-x82p-q773, ...)
    # patched in 2.14.0, and GHSA-42vr-xj54-vc7v (RecursionError DoS) patched in 2.15.0.
    "PyJWT>=2.15.0,<3.0.0",
    "ulid-py>=1.1.0,<2.0.0",
    "psutil>=7.0.0,<8.0.0",
    # NOTE: Look at https://github.com/pydantic/pydantic-ai/blob/main/pydantic_ai_slim/pyproject.toml
    # The `mcp` extra pulls `fastmcp-slim[client]`, required by `MCPToolset`.
    # Security fix: GHSA-4xgf-cpjx-pc3j - NestedSecretsSettingsSource follows symlinks outside secrets_dir.
    # pydantic-settings is transitive via pydantic-ai-slim → fastmcp-slim → mcp. Pin >=2.14.2.
    "pydantic-settings>=2.14.2",
    "pydantic-ai-slim[mcp]>=2.61.0,<2.62.0",
    # Security fix: GHSA-7xgj-8392-5q4r - a post-transform component authorization
    # check is skipped on direct calls. Patched in 3.4.10. Held to 3.x on purpose:
    # the fix is a patch release, while pydantic-ai-slim's `[mcp]` extra allows
    # `>=3.3.0,<5`, so an unbounded update would take 4.x — a major bump of the MCP
    # transport — for a medium advisory a patch already closes.
    "fastmcp-slim>=3.4.11,<3.5",
    # Security fix: GHSA-v4x8-3wr5-3wq8 (high) - ReadWriteLock's SQLite file is
    # reopened by name, so a planted symlink or journal makes the lock's owner
    # overwrite or unlink its own files; plus GHSA-9vhv-jxww-xfm5 and
    # GHSA-567q-5qvw-pf92 (low, Windows side files and an oplock that defeats the
    # stale break). All three patched in 4.2.1. filelock arrives via
    # huggingface-hub, which asks only for >=3.10.0.
    "filelock>=4.2.1,<5.0",
    # Security fix: CVE-2026-114603 - unbounded tracestate parsing. This floor used
    # to sit on the `rag` extra, carried there by chromadb's OTLP exporter; the extra
    # is gone but the package is not: pydantic-ai-slim (>=1.28.0) and mistralai
    # (>=1.33.1) both pull opentelemetry-api, so the pin belongs to the base install.
    "opentelemetry-api>=1.45.1",
    # NOTE: Make sure the following dependencies are not conflicting with pydantic-ai-slim
    # `openai` is a core dependency (not an extra) because every OpenAI-compatible
    # provider routes through it — OpenAI, Ollama, DeepSeek, OpenRouter, Z.ai,
    # Cerebras, Together, and the rest.
    # >=3.26.0 is a hard floor, not a preference: it's pydantic-ai-slim's own
    # `openai` extra floor as of 2.61.0 (3.19.0 as of 2.54.0, 3.8.0 as of 2.41.0).
    # We take `pydantic-ai-slim[mcp]`, not its `openai` extra, so the resolver
    # never enforces that floor for us — it stayed at 3.19.0 while pydantic-ai
    # moved from 2.54.0 to 2.61.0. An older SDK is untested against this
    # pydantic-ai version and may miss parameters `OpenAIChatModel` sends
    # unconditionally (e.g. `prompt_cache_options=`).
    "openai>=3.26.0",
    "prompt-toolkit>=3",
    "rich>=13",
    # Security fix: GHSA/CVE-2026-59950 - Cross-Site WebSocket Hijacking via unvalidated Host/Origin
    # headers in the deprecated WebSocket server transport. We pin >=1.28.1.
    "mcp>=1.28.1,<2.0",
    "requests>=2.33.0,<3.0.0",
    "tiktoken>=0.12.0,<0.13.0",
    "markdownify>=1.2.2,<2.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "pyperclip>=1.11.0,<2.0.0",
    # Pure-Python LaTeX->Unicode conversion for markdown math rendering
    # (util/cli/latex_math.py). Zero transitive deps, tiny (<1MB) -- core
    # rather than an extra, since the render toggle defaults on.
    "pylatexenc>=2.10,<3.0.0",
    # Pure-Python Mermaid->Unicode diagram rendering
    # (util/cli/mermaid_diagram.py). Zero transitive deps. Pinned tight
    # (<0.9.0): termaid is pre-1.0.
    "termaid>=0.8.0,<0.9.0",
    # Security fix: CVE-2026-40192 - Decompression bomb via unlimited GZIP read in FITS decoding.
    # Security fix: CVE-2026-59204 - DoS via memory-allocation state accumulation in the JPEG2000 decoder.
    # Pillow is a transitive dependency via pdfplumber. 39 advisories are open against 12.3.0 and every
    # one of them is closed only by 13.0.0 -- including CVE-2026-112900 (argument injection into the
    # Ghostscript call, RCE), CVE-2026-112902 (TIFF encoder memory disclosure) and CVE-2026-112403
    # (JPEG heap overflow) -- so the floor is 13.0.0. It could not move earlier: pipecat-ai 1.12.0
    # required `Pillow>=11.1.0,<13` and the resolver rejected 13.0.0 outright; 1.14.0 allows `<14`.
    "Pillow>=13.0.0",
    # Security fix: CVE-2026-4539 - ReDoS vulnerability in AdlLexer (GUID regex).
    # pygments is a transitive dependency via rich and pytest. We pin >=2.20.0.
    "pygments>=2.20.0",
    # Security fix: CVE-2026-39892 - cryptography is a transitive dependency via pdfminer-six
    # (pulled in by pdfplumber) and google-auth. We pin >=46.0.7.
    # Security fix: GHSA-537c-gmf6-5ccf - Out-of-bounds read via statically linked OpenSSL. We pin >=48.0.1.
    "cryptography>=48.0.1",
    # Security fix: certifi ships emSign root CAs whose intermediate keys are compromised, so a TLS
    # peer built on them can be impersonated. certifi is transitive via requests, httpx and boto3.
    # We pin >=2026.10.19.
    "certifi>=2026.10.19",
    # Security fix: CVE-2026-42561 (GHSA-pp6c-gr5w-3c5g) - CPU exhaustion via unlimited multipart
    # header count and size in form-data submissions. python-multipart is transitive via mcp. We pin >=0.0.27.
    # Security fix: GHSA-5rvq-cxj2-64vf (CVE-2026-53539) - quadratic-time DoS via ; separators in url-encoded bodies. We pin >=0.0.30.
    "python-multipart>=0.0.30",
    # Security fix: GHSA-86qp-5c8j-p5mr (CVE-2026-48710) - Missing Host header validation poisons
    # request.url.path, bypassing path-based security checks. starlette is a dependency of fastapi. We pin >=1.0.1.
    # Security fix: GHSA-82w8-qh3p-5jfq (CVE-2026-54283) - request.form() limits silently ignored
    # for application/x-www-form-urlencoded, enabling DoS. We pin >=1.3.1.
    "starlette>=1.3.1",
    # Security fix: CVE-2026-44432 - urllib3 does not strip cookies on HTTP redirect from HTTPS.
    # Security fixes: GHSA-8988-9cw3-xx77 (HTTPS proxy TLS override), GHSA-vxq7-64xx-v4gw
    # (unbounded chunk-size line buffering) and GHSA-gh4c-6fx4-qh6g (chunked-deflate infinite
    # loop), patched in 2.8.0. urllib3 is transitive via requests and boto3. We pin >=2.8.0.
    "urllib3>=2.8.0",
    # Security fix: GHSA-65pc-fj4g-8rjx (CVE-2026-45409) - DoS via crafted input to idna.encode().
    # idna is transitive via requests, httpx, anyio (pydantic-ai). We pin >=3.15.
    "idna>=3.15",
    # Security fix: CVE-2026-104874 - reference leak in MultiDict view operations.
    # multidict is transitive via aiohttp in optional extras; we pin >=6.9.1.
    "multidict>=6.9.1",
    # pydantic-ai-slim's HTTP layer moved to httpx2 (was httpx) as of 2.36.0.
    # >=2.7 matches pydantic-ai's own floor for it.
    "httpx2>=2.7.0",
]

[project.urls]
homepage = "https://github.com/state-alchemists/zrb"
repository = "https://github.com/state-alchemists/zrb"
documentation = "https://github.com/state-alchemists/zrb"

[project.optional-dependencies]
# Install all extras:
# - poetry install --all-extras
# - pip install "zrb[playwright,cohere,vertexai,google,anthropic,groq,mistral,xai,bedrock,huggingface,voyageai,voice,python]"
# Install a specific extra:
# - poetry install -E voice
# - pip install "zrb[voice]"
python = [
    # Security fix: CVE-2026-114134 - the GitHub Action installed an unvalidated `required-version`
    # from pyproject.toml. Patched in 26.10.1.
    "black>=26.10.1,<27.0.0",
    "isort>=7.0.0,<8.0.0",
]
#
# NOTE: Make sure these dependencies do not conflict with pydantic-ai-slim. Security
# pins on transitive packages are annotated inline on the dependency that carries them.
playwright = ["playwright>=1.56.0,<2.0.0"]
cohere = ["cohere>=5.20.6"]
vertexai = [
    "google-auth>=2.36.0",
    # Security fix: CVE-2026-23491 - DoS via uncontrolled recursion in ASN.1 decoding (via google-auth).
    # Security fix: CVE-2026-59886 - resource exhaustion via large exponents in univ.Real decoding. We pin >=0.6.4.
    "pyasn1>=0.6.4",
]
# >=2.25.0 matches pydantic-ai-slim's own `google` extra floor as of 2.54.0 (was 2.18.0).
google = ["google-genai>=2.25.0"]
# >=1.9.0 matches pydantic-ai-slim's own `anthropic` extra floor as of 2.54.0 (was 1.3.0).
anthropic = ["anthropic>=1.9.0"]
groq = ["groq>=0.25.0"]
# >=2.9.2 is pydantic-ai-slim's own mistral extra floor as of 2.54.0. This also
# clears the mistralai==2.4.6 PyPI quarantine (GHSA, see pydantic-ai #5382) that
# an explicit `!=2.4.6` exclusion used to be needed for.
mistral = ["mistralai>=2.9.2"]
xai = [
    # >=1.16.0 matches pydantic-ai's floor for the xAI SDK.
    "xai-sdk>=1.16.0",
    # Security fix: GHSA-hg6j-4rv6-33pg (CVE-2026-47265) - cross-origin redirect leaks per-request cookies.
    # Security fix: GHSA-xcgm-r5h9-7989 (CVE-2026-54274) - incomplete WebSocket frame payloads bypass memory limits.
    # Security fix: GHSA-mfx4-hv73-q22v (CVE-2026-69243) - HTTP request smuggling via WebSocket upgrade.
    # Security fix: GHSA-mq44-7p77-q5h7 (CVE-2026-59881) - WebSocket client accepts compressed frames without negotiated permessage-deflate.
    # Security fix: GHSA-cq5v-8q36-5273 (CVE-2026-69244) - out-of-bounds heap read in the C response parser. We pin >=3.14.4.
    # Security fixes, patched in 3.14.4: CVE-2026-111750 (pure-Python parser request smuggling),
    # CVE-2026-111066 (file-descriptor exhaustion in multipart), CVE-2026-111064 (no initial
    # request/header timeout), CVE-2026-111065 (connector pool exhaustion via Max-Age overflow),
    # CVE-2026-111063 and CVE-2026-111749 (cookie scope and Host-Only bypass) and CVE-2026-111748
    # (absolute-form request target spoofs Request.scheme).
    "aiohttp>=3.14.4",
]
bedrock = ["boto3>=1.42.63"]
huggingface = [
    "huggingface-hub[inference]>=1.3.4,<2.0.0",
    # huggingface_hub 1.3.x calls the deprecated hf_xet.download_files() API,
    # so hf-xet must stay below 1.5.0. Mirrors pydantic-ai-slim's huggingface extra.
    "hf-xet<1.5.0; platform_machine == 'x86_64' or platform_machine == 'amd64' or platform_machine == 'AMD64' or platform_machine == 'arm64' or platform_machine == 'aarch64'",
]
voyageai = [
    "voyageai>=0.3.7 ; python_version < '3.14'",
    # Security fix: CVE-2026-34070, CVE-2026-44843 (GHSA-pjwx-r37v-7724) - unsafe deserialization.
    "langchain-core>=1.3.3",
    # Security fix: GHSA-hg6j-4rv6-33pg (CVE-2026-47265) - cross-origin redirect leaks per-request cookies.
    # Security fix: GHSA-xcgm-r5h9-7989 (CVE-2026-54274) - incomplete WebSocket frame payloads bypass memory limits.
    # Security fix: GHSA-mfx4-hv73-q22v (CVE-2026-69243) - HTTP request smuggling via WebSocket upgrade.
    # Security fix: GHSA-mq44-7p77-q5h7 (CVE-2026-59881) - WebSocket client accepts compressed frames without negotiated permessage-deflate.
    # Security fix: GHSA-cq5v-8q36-5273 (CVE-2026-69244) - out-of-bounds heap read in the C response parser. We pin >=3.14.4.
    # Security fixes, patched in 3.14.4: CVE-2026-111750 (pure-Python parser request smuggling),
    # CVE-2026-111066 (file-descriptor exhaustion in multipart), CVE-2026-111064 (no initial
    # request/header timeout), CVE-2026-111065 (connector pool exhaustion via Max-Age overflow),
    # CVE-2026-111063 and CVE-2026-111749 (cookie scope and Host-Only bypass) and CVE-2026-111748
    # (absolute-form request target spoofs Request.scheme).
    "aiohttp>=3.14.4",
    # Security fix: GHSA-fv5p-p927-qmxr - SSRF via redirect bypass in HTMLHeaderTextSplitter.split_text_from_url().
    "langchain-text-splitters>=1.1.2",
    # Security fix: GHSA-3644-q5cj-c5c7 (CVE-2026-45134) - unsafe prompt-manifest deserialization.
    # Security fix: GHSA-f4xh-w4cj-qxq8 - TracingMiddleware arbitrary server-side file read.
    "langsmith>=0.8.18",
]
voice = [
    "vosk>=0.3.44,<0.3.45; sys_platform == 'darwin'",
    "vosk>=0.3.45; sys_platform != 'darwin'",
    "sounddevice>=0.5.1",
    "numpy>=1.26.0",
    # macOS voice processing, for echo cancellation (ADR-0111).
    "pyobjc-framework-AVFoundation>=12.0; sys_platform == 'darwin'",
    # The pipeline zrb's voice is moving onto (ADR-0107). Pinned to the minor:
    # pipecat is pre-2.0 and moving under its users — `PipelineTask` is
    # deprecated in favour of `PipelineWorker`, which no longer starts itself,
    # and `WakeCheckFilter` goes away in 2.0.0 — so a minor bump is a migration
    # rather than an upgrade. 1.14.0 is the first minor whose Pillow ceiling
    # (`<14`) admits Pillow 13; it also lifts the onnxruntime cap from
    # `~=1.24.3` to `<2`.
    "pipecat-ai>=1.14.0,<1.15.0",
]

[project.scripts]
zrb = "zrb.__main__:serve_cli"

[tool.poetry]
exclude = [
    "__pycache__",
    "_images",
    ".github",
    ".pytest_cache",
    ".venv",
    ".vscode",
    "dist",
    "docs",
    "htmlcov",
    "playground",
    "test",
    ".coverage",
    ".coveragerc",
    ".cprofile.prof",
    ".cprofile.svg",
    ".env",
    ".flake8",
    ".gitignore",
    ".python-version",
    "install.sh",
    "project.sh",
    "README.md",
    "template.env",
    "zrb_init.py"
]

[tool.poetry.group.dev.dependencies]
autopep8 = "^2.3.2"
flake8 = "^7.2.0"
# Pinned exact: pyright ships frequent releases that add diagnostics; a caret
# range could break the CI type-gate on an unrelated auto-upgrade.
pyright = "1.1.414"
# Security fix: CVE-2025-71176 - Local privilege escalation via /tmp/pytest-of-{user} directories.
pytest = ">=9.0.3"
pytest-cov = "^6.1.0"
pytest-asyncio = "^1.3.0"
# The suite is wait-bound (real subprocess timeouts/kills), not CPU-bound —
# ~33% average CPU utilization on a full run. Parallel workers overlap those
# real-time waits instead of serializing them.
pytest-xdist = "^3.6.1"
# The suite drives real subprocesses, so a deadlock is a plausible failure mode.
# Without a per-test cap it reads as a slow run until the job-level ceiling kills
# the whole job, naming no test.
pytest-timeout = "^2.3.1"
tomlkit = "^0.13.3"
radon = "^6.0.1"
pdoc = ">=15"
# The 'sensevoice' dictation backend's engine. Optional for users (no Termux
# wheel), so it is not in the voice extra; here so pyright and the tests see it.
sherpa-onnx = "^1.13.8"

[tool.pytest.ini_options]
# Pin the suite to `src/`. Without it `import zrb` resolves by whatever is on
# sys.path, so a venv out of step with poetry.lock serves a stale
# `site-packages/zrb` and the run reports green against code that is not in
# the diff.
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
# A deadlock detector, not a performance budget: the slowest honest tests wait
# on real process termination, so the ceiling is generous.
timeout = 60
# Setting this replaces pytest's defaults, so they are restated ahead of the
# project's own: without `.*` the run collects the copies in `.zrb/worktree/`
# and other hidden directories.
norecursedirs = "*.egg .* _darcs build CVS dist node_modules venv {arch} playground examples"
# Deprecations raised inside third-party packages zrb cannot change: pipecat
# subclasses its own deprecated `AudioContextTTSService`, and starlette's
# `TestClient` uses the old `anyio.abc.BlockingPortal` alias.
filterwarnings = [
    "ignore:`AudioContextTTSService` is deprecated:DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
